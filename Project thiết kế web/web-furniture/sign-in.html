<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/sign-in.css">
    <script src="https://kit.fontawesome.com/dc671aac30.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/x-icon" href="assets/img/logo-banner-favicon/ute.png">
    <title>Web đăng ký</title>
</head>
<body>
    <div class="wrapper">
        <form action="">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="Username"required/>
                <i class="fa-solid fa-user" style="color:#fff"></i>            
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password"required/>
                <i class="fa-solid fa-lock" style="color:#fff"></i>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn">Login</button>
            
            <div class="register-link">
                <p>Don't have an account?<a href="#"> Register</a></p>
            </div>
        </form>
    </div>

</body>

</html>
